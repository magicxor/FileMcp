# On every semver tag (1.2.3 or a pre-release like 1.2.3-rc.1, no v prefix),
# publishes the framework-dependent (arch- and OS-neutral IL) FileMcp build as
# tar.gz/zip assets on a GitHub Release, so consumers can pin a version and run
# it with `dotnet FileMcp.dll` (the published output includes appsettings.json).
#
# There is deliberately NO container image: FileMcp is a fully local stdio MCP
# server spawned by an MCP client, not a self-sufficient network service.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release-assets:
    name: Publish release assets
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish FileMcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish FileMcp/FileMcp.csproj \
            -c Release -o publish /p:UseAppHost=false /p:Version="$VERSION"

      - name: Pack assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "FileMcp-$VERSION.tar.gz" -C publish .
          (cd publish && zip -qr "../FileMcp-$VERSION.zip" .)
          sha256sum "FileMcp-$VERSION.tar.gz" "FileMcp-$VERSION.zip" > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            FileMcp-*.tar.gz
            FileMcp-*.zip
            checksums.txt
